apiVersion: apps/v1
kind: Deployment
metadata:
  name: sem-api
  namespace: sem
  labels:
    app: sem-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sem-api
  template:
    metadata:
      labels:
        app: sem-api
    spec:
      serviceAccountName: sem-api
      containers:
        - name: api
          image: europe-north2-docker.pkg.dev/project-72f15835-9e20-4691-877/sem-images/api:latest
          command: ["/app/server"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: sem-api-config
            - secretRef:
                name: sem-app-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: sem-api
  namespace: sem
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector:
    app: sem-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: sem-api-healthcheck
  namespace: sem
spec:
  default:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    config:
      type: HTTP
      httpHealthCheck:
        port: 8080
        requestPath: /health
  targetRef:
    group: ""
    kind: Service
    name: sem-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sem-api-hpa
  namespace: sem
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sem-api
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
