apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: sem-gateway
  namespace: sem
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: sem-gateway-ip
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        options:
          networking.gke.io/pre-shared-certs: sem-gateway-cert
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sem-app-route
  namespace: sem
spec:
  parentRefs:
    - name: sem-gateway
  hostnames:
    - "socialeventmapper.com"
    - "app.socialeventmapper.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/docs
      backendRefs:
        - name: sem-web
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: sem-api
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: sem-web
          port: 80
