apiVersion: apps/v1
kind: Deployment
metadata:
  name: sem-web
  namespace: sem
  labels:
    app: sem-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sem-web
  template:
    metadata:
      labels:
        app: sem-web
    spec:
      containers:
        - name: web
          image: europe-north2-docker.pkg.dev/project-72f15835-9e20-4691-877/sem-images/web:latest
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: sem-web
  namespace: sem
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector:
    app: sem-web
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: sem-web-healthcheck
  namespace: sem
spec:
  default:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    config:
      type: HTTP
      httpHealthCheck:
        port: 80
        requestPath: /
  targetRef:
    group: ""
    kind: Service
    name: sem-web
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sem-web-hpa
  namespace: sem
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sem-web
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
